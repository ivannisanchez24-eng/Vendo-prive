<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vendo Privé</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181818;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    button {
      background: #d9a7ff;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
      background: linear-gradient(135deg, #321641, #111);
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      margin-bottom: 25px;
    }

    .search {
      width: 90%;
      max-width: 500px;
      padding: 15px;
      border-radius: 8px;
      border: none;
    }

    main {
      padding: 35px 7%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
    }

    .avatar {
      height: 180px;
      border-radius: 10px;
      background: #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      margin-bottom: 15px;
    }

    .card p {
      color: #bbb;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #888;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🌙 Vendo Privé</div>
  <button onclick="alert('Próximamente podrás crear tu perfil')">
    Crear perfil
  </button>
</header>

<section class="hero">

  <h1>Vendo Privé</h1>

  <p>
    Conecta con personas adultas en un espacio privado.
  </p>

  <input
    class="search"
    type="text"
    placeholder="Buscar por ciudad..."
  >

</section>

<main>

  <h2>Perfiles destacados</h2>

  <div class="grid">

    <div class="card">
      <div class="avatar">👤</div>
      <h3>Sofía, 25</h3>
      <p>📍 Santo Domingo</p>
      <p>Perfil de ejemplo</p>
    </div>

    <div class="card">
      <div class="avatar">👤</div>
      <h3>Valentina, 27</h3>
      <p>📍 Santiago</p>
      <p>Perfil de ejemplo</p>
    </div>

  </div>

</main>

<footer>
  <p>Vendo Privé · Plataforma exclusiva para mayores de 18 años</p>
</footer>

</body>
</html>
