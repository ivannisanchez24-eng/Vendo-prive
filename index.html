<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vendo Privé</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181818;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    button {
      background: #d9a7ff;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
      background: linear-gradient(135deg, #321641, #111);
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #ccc;
      margin-bottom: 25px;
    }

    .search {
      width: 90%;
      max-width: 500px;
      padding: 15px;
      border-radius: 8px;
      border: none;
    }

    main {
      padding: 35px 7%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
    }

    .avatar {
      height: 180px;
      border-radius: 10px;
      background: #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      margin-bottom: 15px;
    }

    .card p {
      color: #bbb;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #888;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🌙 Vendo Privé</div>
  <button onclick="alert('Próximamente podrás crear tu perfil')">
    Crear perfil
  </button>
</header>

<section class="hero">

  <h1>Vendo Privé</h1>

  <p>
    Conecta con personas adultas en un espacio privado.
  </p>

  <input
    class="search"
    type="text"
    placeholder="Buscar por ciudad..."
  >

</section>

<main>

  <h2>Perfiles destacados</h2>

  <div class="grid">

    <div class="card">
      <div class="avatar">👤</div>
      <h3>Sofía, 25</h3>
      <p>📍 Santo Domingo</p>
      <p>Perfil de ejemplo</p>
    </div>

    <div class="card">
      <div class="avatar">👤</div>
      <h3>Valentina, 27</h3>
      <p>📍 Santiago</p>
      <p>Perfil de ejemplo</p>
    </div>

  </div>

</main>

<footer>
  <p>Vendo Privé · Plataforma exclusiva para mayores de 18 años</p>
</footer>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://pbnzdhtbrbfhkqtmipzu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = sb_publishable_61lQD9NvLn8jXFU0bVHeMA_r-5cYA7n

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

// Crear ventana de registro
document.querySelector('button[onclick*="crear tu perfil"]').onclick = function () {

  const registro = document.createElement("div");

  registro.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
  `;

  registro.innerHTML = `
    <div style="
      background:white;
      color:#222;
      padding:25px;
      border-radius:15px;
      width:100%;
      max-width:400px;
    ">
      <h2>Crear perfil</h2>

      <input id="registroEmail"
        type="email"
        placeholder="Tu correo electrónico"
        style="width:100%;padding:12px;margin:8px 0;">

      <input id="registroPassword"
        type="password"
        placeholder="Contraseña"
        style="width:100%;padding:12px;margin:8px 0;">

      <label style="display:block;margin:12px 0;">
        <input id="mayorEdad" type="checkbox">
        Confirmo que tengo 18 años o más
      </label>

      <button id="crearCuenta"
        style="width:100%;padding:12px;">
        Crear cuenta
      </button>

      <p id="mensajeRegistro"></p>

      <button id="cerrarRegistro"
        style="width:100%;padding:10px;margin-top:8px;">
        Cancelar
      </button>
    </div>
  `;

  document.body.appendChild(registro);

  document.getElementById("cerrarRegistro").onclick = () => {
    registro.remove();
  };

  document.getElementById("crearCuenta").onclick = async () => {

    const email = document.getElementById("registroEmail").value;
    const password = document.getElementById("registroPassword").value;
    const mayorEdad = document.getElementById("mayorEdad").checked;
    const mensaje = document.getElementById("mensajeRegistro");

    if (!mayorEdad) {
      mensaje.textContent = "Debes confirmar que tienes 18 años o más.";
      return;
    }

    if (!email || !password) {
      mensaje.textContent = "Completa el correo y la contraseña.";
      return;
    }

    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      mensaje.textContent = error.message;
      return;
    }

    mensaje.textContent =
      "Cuenta creada. Revisa tu correo para confirmar tu cuenta.";
  };
};
</script>
</body>
</html>
