<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendo Privé</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
}

header{
  padding:18px;
  background:#181818;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:bold;
  cursor:pointer;
}

.btn-principal{
  background:#d9a7ff;
  color:#111;
}

.hero{
  text-align:center;
  padding:55px 20px 35px;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero p{
  color:#ccc;
  font-size:17px;
}

.buscar{
  display:block;
  width:90%;
  max-width:500px;
  margin:20px auto;
  padding:15px;
  border-radius:12px;
  border:1px solid #444;
  background:#222;
  color:white;
  font-size:16px;
}

.perfiles{
  width:92%;
  max-width:900px;
  margin:30px auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:#1d1d1d;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #333;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.card-info{
  padding:15px;
}

.card-info h3{
  margin-bottom:7px;
}

.card-info p{
  color:#bbb;
  margin-bottom:12px;
}

footer{
  text-align:center;
  padding:30px;
  color:#888;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
  overflow:auto;
}

.modal-box{
  background:#fff;
  color:#222;
  width:100%;
  max-width:430px;
  padding:25px;
  border-radius:18px;
}

.modal-box h2{
  margin-bottom:18px;
}

.modal-box input,
.modal-box select,
.modal-box textarea{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
}

.modal-box textarea{
  min-height:100px;
  resize:vertical;
}

.edad{
  display:flex;
  gap:10px;
}

.edad input{
  width:50%;
}

.acciones{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.acciones button{
  flex:1;
}

.mensaje{
  margin-top:12px;
  font-weight:bold;
}

.cerrar{
  background:#ddd;
}

.oculto{
  display:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">🌙 Vendo Privé</div>

  <button class="btn-principal" id="crearPerfilBtn">
    Crear perfil
  </button>
</header>

<section class="hero">
  <h1>Vendo Privé</h1>
  <p>Conecta con personas adultas en un espacio privado.</p>
</section>

<input
  class="buscar"
  id="buscarCiudad"
  type="text"
  placeholder="Buscar por ciudad..."
>

<section class="perfiles" id="listaPerfiles">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80">
    <div class="card-info">
      <h3>Sofía, 25</h3>
      <p>Santo Domingo</p>
      <button class="btn-principal">Ver perfil</button>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80">
    <div class="card-info">
      <h3>Valentina, 27</h3>
      <p>Santiago</p>
      <button class="btn-principal">Ver perfil</button>
    </div>
  </div>

</section>

<footer>
  Vendo Privé · Plataforma exclusiva para mayores de 18 años
</footer>


<!-- MODAL REGISTRO -->

<div class="modal" id="registroModal">

  <div class="modal-box">

    <h2>Crear tu perfil</h2>

    <p style="margin-bottom:15px;color:#666;">
      Crea tu cuenta para entrar a Vendo Privé.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Correo electrónico"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña: mínimo 8 caracteres, letras y números"
    >

    <input
      id="nombre"
      type="text"
      placeholder="Nombre o nombre de usuario"
    >

    <select id="genero">
      <option value="">Selecciona tu género</option>
      <option value="Mujer">Mujer</option>
      <option value="Hombre">Hombre</option>
    </select>

    <input
      id="edad"
      type="number"
      min="18"
      max="100"
      placeholder="Edad"
    >

    <input
      id="ciudad"
      type="text"
      placeholder="Ciudad"
    >

    <textarea
      id="descripcion"
      placeholder="Escribe una descripción de tu perfil..."
    ></textarea>

    <label style="display:block;margin:12px 0;">
      <input
        id="mayorEdad"
        type="checkbox"
        style="width:auto;"
      >
      Confirmo que tengo 18 años o más
    </label>

    <div class="acciones">
      <button class="btn-principal" id="registrarBtn">
        Crear cuenta
      </button>

      <button class="cerrar" id="cerrarBtn">
        Cancelar
      </button>
    </div>

    <p class="mensaje" id="mensaje"></p>

  </div>
</div>


<script>

const SUPABASE_URL =
"https://pbnzdhtbrbfhkqtmipzu.supabase.co";

/*
  IMPORTANTE:
  Pon aquí tu Publishable key de Supabase.
  No uses una service_role key.
*/

const SUPABASE_PUBLISHABLE_KEY =
sb_publishable_61lQD9NvLn8jXFU0bVHeMA_r-5cYA7n


const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// ABRIR REGISTRO

document.getElementById("crearPerfilBtn").addEventListener(
  "click",
  function(){

    document.getElementById("registroModal").style.display="flex";

  }
);


// CERRAR REGISTRO

document.getElementById("cerrarBtn").addEventListener(
  "click",
  function(){

    document.getElementById("registroModal").style.display="none";

  }
);


// REGISTRAR USUARIO

document.getElementById("registrarBtn").addEventListener(
  "click",
  async function(){

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const nombre =
      document.getElementById("nombre").value.trim();

    const genero =
      document.getElementById("genero").value;

    const edad =
      Number(document.getElementById("edad").value);

    const ciudad =
      document.getElementById("ciudad").value.trim();

    const descripcion =
      document.getElementById("descripcion").value.trim();

    const mayorEdad =
      document.getElementById("mayorEdad").checked;

    const mensaje =
      document.getElementById("mensaje");


    mensaje.textContent="";


    // EDAD

    if(!mayorEdad){

      mensaje.textContent =
      "Debes confirmar que tienes 18 años o más.";

      return;
    }


    if(!edad || edad < 18){

      mensaje.textContent =
      "Debes tener 18 años o más.";

      return;
    }


    // CORREO

    if(!email){

      mensaje.textContent =
      "Escribe tu correo electrónico.";

      return;
    }


    // CONTRASEÑA

    if(
      password.length < 8 ||
      !/[A-Za-z]/.test(password) ||
      !/[0-9]/.test(password)
    ){

      mensaje.textContent =
      "La contraseña debe tener mínimo 8 caracteres e incluir letras y números.";

      return;
    }


    // DATOS DEL PERFIL

    if(!nombre || !genero || !ciudad){

      mensaje.textContent =
      "Completa nombre, género y ciudad.";

      return;
    }


    const { data, error } =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            nombre:nombre,
            genero:genero,
            edad:edad,
            ciudad:ciudad,
            descripcion:descripcion,
            mayor_de_edad:true
          }
        }

      });


    if(error){

      mensaje.textContent =
      error.message;

      return;
    }


    mensaje.textContent =
    "¡Cuenta creada! Revisa tu correo electrónico para confirmar tu cuenta.";

  }
);


// BUSCAR CIUDAD

document.getElementById("buscarCiudad").addEventListener(
  "input",
  function(){

    const texto =
      this.value.toLowerCase().trim();

    const perfiles =
      document.querySelectorAll(".card");

    perfiles.forEach(function(perfil){

      const contenido =
        perfil.textContent.toLowerCase();

      perfil.style.display =
        contenido.includes(texto)
        ? ""
        : "none";

    });

  }
);

</script>

</body>
</html>
